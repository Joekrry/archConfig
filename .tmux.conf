unbind C-b

set-option -g prefix C-w

bind-key C-w send-prefix

bind n split-window -v

bind v split-window -h -p 25 -c"#{pane_current_path}"

unbind '"'

unbind %

bind -n C-h select-pane -L

bind -n C-l select-pane -R

bind -n C-k select-pane -U

bind -n C-j select-pane -D

set-window-option -g mode-keys vi

bind s copy-mode

# --- Tokyo Night theme ---

set -g default-terminal "tmux-256color"

set -ag terminal-overrides ",xterm-256color:RGB"

set -g status on

set -g status-position bottom

set -g status-justify left

set -g status-style "bg=#1a1b26,fg=#c0caf5"

set -g status-left-length 40

set -g status-left "#[fg=#1a1b26,bg=#7aa2f7,bold] #S #[fg=#7aa2f7,bg=#1a1b26,nobold]"

set -g status-right-length 60

set -g status-right "#[fg=#c0caf5,bg=#292e42] %Y-%m-%d #[fg=#1a1b26,bg=#7aa2f7,bold] %H:%M "

set -g window-status-format "#[fg=#565f89,bg=#1a1b26] #I:#W "

set -g window-status-current-format "#[fg=#1a1b26,bg=#bb9af7,bold] #I:#W #[fg=#bb9af7,bg=#1a1b26,nobold]"

set -g window-status-separator ""

set -g pane-border-style "fg=#292e42"

set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "fg=#1a1b26,bg=#7dcfff,bold"

set -g mode-style "fg=#1a1b26,bg=#bb9af7"

set -g clock-mode-colour "#7aa2f7"
