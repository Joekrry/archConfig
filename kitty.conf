shell fish

allow_remote_control yes

# Material 3 palette generated from the wallpaper by noctalia.
# noctalia writes ~/.config/kitty/themes/noctalia.conf and points
# current-theme.conf at it, then live-reloads kitty, on every wallpaper/scheme
# change (requires the "Kitty" template enabled in noctalia Settings).
include ./current-theme.conf

# Animated cursor
cursor_trail 10
cursor_trial_start_threshold 0
cursor_trail_decay 0.01 0.1
cursor_shape block
cursor_blink true

# Font (matches your nvim guifont)
font_family JetBrainsMono Nerd Font
font_size 11.0
